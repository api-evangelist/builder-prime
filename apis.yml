aid: builder-prime
name: Builder Prime
description: 'Builder Prime is an all-in-one CRM and business management platform built
  for home improvement contractors and remodelers. It combines lead and client management,
  appointment setting, estimating and price books, proposals and e-signature contracts,
  project and production scheduling, invoicing and payments, SMS and email communication,
  marketing automation, and sales reporting in a single multi-tenant web and mobile
  application. Each customer works from its own subdomain, and Builder Prime exposes
  a REST "Open API" plus webhooks and a Zapier app so contractors can push leads and
  pull client, employee, project and appointment data between Builder Prime and lead
  aggregators, call centers, financing partners, measurement tools and accounting systems.'
